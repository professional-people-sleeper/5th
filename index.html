<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Anesth 5th</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #f0f0f0; }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>
  <!-- ใส่ลิงก์ Google Apps Script ของคุณตรงนี้ -->
  <iframe src="https://script.google.com/macros/s/AKfycbzWB8IRedROnWtFpy08Ss7CsbX2HPcdzqUDGFa1-HumfO-IUJqmBOEI-FfKA3aEJWA/exec"></iframe>

  <script>
    // ลงทะเบียน Service Worker เพื่อให้มือถือมองว่าเป็นแอป
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(() => console.log('Service Worker Registered'));
    }
  </script>
</body>
</html>
